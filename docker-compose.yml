version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: ai-store-builder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_store_builder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_store_builder"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-store-builder-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: http://localhost:3000
      AUTH_SECRET: replace-with-long-random-secret
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ai_store_builder
      GEMINI_API_KEY: ""
      AI_MOCK_MODE: "true"

volumes:
  postgres_data:
